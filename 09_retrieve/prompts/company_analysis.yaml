# D:\AI Project\financial_agent_V1\09_retrieve\prompts\company_analysis.yaml
# Company comprehensive analysis prompt template

template: |
  You are a senior financial analyst. Please conduct a comprehensive company analysis based on the following news data about {company_name} ({ticker}) over the past {days} days.

  **IMPORTANT: ALL OUTPUT MUST BE IN ENGLISH ONLY.**

  {company_info}
  {news_overview}
  {recent_news_section}

  【Representative News Details】
  {representative_text}

  【Analysis Task】
  Please conduct a comprehensive analysis including storyline and 5-dimensional impact analysis:

  0. **Storyline & What Happened** ⭐IMPORTANT
     - What important events happened recently?
     - Causes and development process of events
     - Keytime nodes and turning points
     - Main participants and their roles
     - Causal relationships between events

  1. **Financial Impact**
  2. **Operational Impact**
  3. **Market Impact**
  4. **Regulatory Impact**
  5. **Strategic Impact**
  6. **Future Outlook** ⭐REQUIRED - Must include score, analysis, short/medium/long term impacts, and risk analysis

  【Scoring Guidelines】⭐CRITICAL
  Each dimension uses a scale from -10 to 10:
  
  **Positive Scores (Impact is beneficial):**
  - +9 to +10: Exceptional positive impact - transformative growth, breakthrough achievements, major competitive advantages
  - +7 to +8: Strong positive impact - significant revenue growth, market expansion, strategic wins
  - +5 to +6: Moderate positive impact - steady improvement, incremental gains, favorable trends
  - +3 to +4: Mild positive impact - slight improvements, minor benefits, small opportunities
  - +1 to +2: Minimal positive impact - negligible benefits, marginal improvements

  **Neutral Score:**
  - 0: No significant impact or mixed effects that cancel out

  **Negative Scores (Impact is detrimental):**
  - -1 to -2: Minimal negative impact - slight concerns, minor setbacks
  - -3 to -4: Mild negative impact - noticeable challenges, small losses, emerging risks
  - -5 to -6: Moderate negative impact - significant headwinds, measurable losses, concerning trends
  - -7 to -8: Strong negative impact - serious problems, substantial losses, major threats
  - -9 to -10: Exceptional negative impact - crisis situation, catastrophic losses, existential threats

  【Output Format】
  Output in JSON format with the following structure:

  {{
    "ticker": "{ticker}",
    "company_name": "{company_name}",
    "analysis_date": "{analysis_date}",
    "analysis_period": "Past {days} days",
    "analysis_period_days": {days},
    "total_news_analyzed": {total_news},
    "storyline": {{
      "summary": "Concise summary in 200-400 characters covering key events and their significance",
      "key_events": [
        {{
          "date": "Date",
          "event": "Event description",
          "impact": "Impact explanation",
          "source_urls": ["URL1", "URL2"]
        }}
      ],
      "timeline": "Chronological description of event development",
      "key_players": ["Key participant 1", "Key participant 2"],
      "cause_effect": "Causal relationship analysis between events",
      "source_urls": ["Key URL1", "Key URL2", "Key URL3"]
    }},
    "financial_impact": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations explaining revenue impact, cost changes, profit margins, and cash flow implications",
      "key_points": ["Point 1", "Point 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "operational_impact": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations covering production efficiency, supply chain effects, and resource allocation",
      "key_points": ["Point 1", "Point 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "market_impact": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations discussing stock performance, market share, competitive position, and brand reputation",
      "key_points": ["Point 1", "Point 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "regulatory_impact": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations addressing compliance requirements, legal risks, policy changes, and regulatory costs",
      "key_points": ["Point 1", "Point 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "strategic_impact": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations evaluating long-term strategy alignment, business model implications, and growth opportunities",
      "key_points": ["Point 1", "Point 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "future_outlook": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive future outlook analysis in 150-250 words with [Source: URL] citations",
      "short_term_impact": "Short-term outlook (1-3 months) with specific catalysts and [Source: URL] citations",
      "medium_term_impact": "Medium-term outlook (3-12 months) with expected developments and [Source: URL] citations",
      "long_term_impact": "Long-term outlook (1-3 years) with structural changes and [Source: URL] citations",
      "risk_analysis": "Comprehensive risk analysis in 100-150 words covering market risks, operational risks, regulatory risks, and mitigation strategies",
      "stakeholder_impact": {{
        "investors": "Impact on investors",
        "companies": "Impact on companies",
        "consumers": "Impact on consumers",
        "regulators": "Impact on regulators"
      }},
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "overall_assessment": {{
      "total_score": "CALCULATE: Sum of all 6 dimension scores (financial_impact + operational_impact + market_impact + regulatory_impact + strategic_impact + future_outlook). Range: -60 to 60",
      "recommendation": "Buy/Hold/Sell",
      "confidence": "Float from 0.0 to 1.0. Calculate based on: (1) News quantity and quality (0-0.3): >10 high-quality news = 0.3, 5-10 news = 0.2, <5 news = 0.1; (2) Evidence clarity (0-0.3): Clear causal relationships and concrete data = 0.3, moderate evidence = 0.2, weak/ambiguous evidence = 0.1; (3) Analysis consistency (0-0.2): Dimension scores align with narrative = 0.2, minor inconsistencies = 0.1, major contradictions = 0.0; (4) Source reliability (0-0.2): Multiple credible sources per dimension = 0.2, some sources missing = 0.1, poor source coverage = 0.0. Example: Good news volume (0.3) + moderate evidence (0.2) + consistent analysis (0.2) + good sources (0.2) = 0.9",
      "confidence_justification": "Brief explanation (50-100 words) justifying the confidence score by referencing the four criteria: news quantity, evidence clarity, analysis consistency, and source reliability. Explain which factors contributed most to the final confidence value.",
      "summary": "Overall summary",
      "key_insights": ["Insight 1", "Insight 2", "Insight 3"],
      "source_urls": ["Key URL1", "Key URL2", "Key URL3"]
    }}

  **CRITICAL INSTRUCTIONS**:
  1. ALL OUTPUT MUST BE IN ENGLISH
  2. **storyline summary**: Must be concise, 200-400 characters only
  3. **Each dimension analysis**: Must be 100-200 words with detailed explanations
  4. **Score justification**: Each dimension MUST include a score_justification field (50-100 words) explaining why the specific score was assigned
  5. **future_outlook is REQUIRED**: Must include score, score_justification, analysis, short/medium/long term impacts, risk_analysis, and stakeholder_impact
  6. **total_score CALCULATION**: total_score MUST equal the sum of all 6 dimension scores (financial + operational + market + regulatory + strategic + future_outlook). Example: if scores are 2, 1, 3, 0, 1, 0, then total_score = 7
  7. Each dimension MUST have at least 2-3 source_urls
  8. Use [Source: URL] format for citations within analysis text
  9. Use ONLY provided news URLs, do NOT fabricate URLs
  10. Provide balanced analysis covering both positive and negative aspects
  11. Include comprehensive risk analysis in future_outlook.risk_analysis field
  12. Scores must align with the scoring guidelines provided above

config:
  max_recent_headlines: 5
  max_representative_news: 12
  headline_max_length: 100
  summary_max_length: 200
  representative_per_type: 2
