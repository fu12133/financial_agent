# 行业综合分析 Prompt 模板

template: |
  You are a senior industry analyst. Please conduct a comprehensive industry analysis based on the following historical news data about the {industry_name} industry over the past {days} days.

  **IMPORTANT: ALL OUTPUT MUST BE IN ENGLISH ONLY. DO NOT USE CHINESE OR ANY OTHER LANGUAGE.**

  {industry_info}
  {news_overview}
  {recent_news_section}

  【Representative News Details】
  {representative_text}

  【Analysis Task】
  Please conduct a comprehensive analysis of the {industry_name} industry from the following 7 dimensions:

  0. **Storyline & What Happened** ⭐IMPORTANT
     - What important events happened recently?
     - Causes and development process of events
     - Keytime nodes and turning points
     - Main participants and their roles
     - Causal relationships between events

  1. **Industry Trend**
  2. **Competitive Landscape**
  3. **Policy & Regulatory Environment**
  4. **Supply Chain & Ecosystem**
  5. **Investment Attractiveness**
  6. **Future Outlook & Impact Analysis** ⭐REQUIRED

  【Scoring Guidelines】⭐CRITICAL
  Each dimension uses a scale from -10 to 10:
  
  **Positive Scores (Impact is beneficial):**
  - +9 to +10: Exceptional positive impact - transformative industry growth, breakthrough innovations, dominant market position, exceptional investment returns
  - +7 to +8: Strong positive impact - significant industry expansion, strong competitive advantages, favorable policies, high investment attractiveness
  - +5 to +6: Moderate positive impact - steady industry growth, moderate competitive strength, supportive policies, good investment potential
  - +3 to +4: Mild positive impact - slight improvements, minor competitive edges, neutral-to-positive policies, modest investment appeal
  - +1 to +2: Minimal positive impact - negligible benefits, marginal improvements, limited investment upside

  **Neutral Score:**
  - 0: No significant impact or mixed effects that cancel out, stable industry conditions

  **Negative Scores (Impact is detrimental):**
  - -1 to -2: Minimal negative impact - slight concerns, minor competitive pressures, minimal regulatory headwinds
  - -3 to -4: Mild negative impact - noticeable challenges, increasing competition, emerging regulatory concerns, modest investment risks
  - -5 to -6: Moderate negative impact - significant industry headwinds, weakening competitive position, unfavorable policies, measurable investment risks
  - -7 to -8: Strong negative impact - serious industry problems, declining market share, restrictive regulations, substantial investment losses
  - -9 to -10: Exceptional negative impact - industry crisis, catastrophic decline, prohibitive regulations, existential threats to industry viability

  【Output Format】
  Please output the analysis results in the following JSON format. **IMPORTANT: In the analysis and source_urls of each dimension, you MUST cite relevant news URLs as evidence support**.

  {{
    "industry": "{industry}",
    "industry_name": "{industry_name}",
    "analysis_date": "{analysis_date}",
    "analysis_period": "Past {days} days",
    "analysis_period_days": {days},
    "total_news_analyzed": {total_news},
    "companies_covered": {companies_covered},
    "storyline": {{
      "summary": "Concise summary in 200-400 characters covering core events and storyline",
      "key_events": [
        {{
          "date": "Date",
          "event": "Event description",
          "impact": "Impact explanation",
          "source_urls": ["URL1", "URL2"]
        }}
      ],
      "timeline": "Chronological description of event development",
      "key_players": ["Key participant 1", "Key participant 2"],
      "cause_effect": "Causal relationship analysis between events",
      "source_urls": ["Key URL1", "Key URL2", "Key URL3"]
    }},
    "industry_trend": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations covering growth trend, technology innovation, market capacity, and cyclical characteristics",
      "key_factors": ["Factor 1", "Factor 2", "Factor 3"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "competitive_landscape": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations discussing market concentration, major players, entry barriers, and substitute threats",
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "policy_regulatory": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations addressing policy support, regulatory changes, international trade impact, and compliance costs",
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "supply_chain_ecosystem": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations evaluating upstream suppliers, downstream demand, industry chain coordination, and key bottlenecks",
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "investment_attractiveness": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive analysis in 100-200 words with [Source: URL] citations analyzing valuation level, profitability, risk-return ratio, and capital flow",
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "future_outlook": {{
      "score": Integer from -10 to 10,
      "score_justification": "Brief explanation (50-100 words) justifying why this specific score was assigned based on the scoring guidelines",
      "analysis": "Comprehensive future outlook analysis in 150-250 words with [Source: URL] citations",
      "short_term_impact": "Short-term (1-3 months) impact analysis with specific catalysts and [Source: URL] citations",
      "medium_term_impact": "Medium-term (3-12 months) impact analysis with expected developments and [Source: URL] citations",
      "long_term_impact": "Long-term (1-3 years) impact analysis with structural changes and [Source: URL] citations",
      "risk_analysis": "Comprehensive risk analysis in 100-150 words covering industry risks, market risks, regulatory risks, and mitigation strategies",
      "stakeholder_impact": {{
        "investors": "Impact on investors",
        "companies": "Impact on companies in the industry",
        "consumers": "Impact on consumers",
        "regulators": "Impact on regulators"
      }},
      "key_factors": ["Factor 1", "Factor 2"],
      "source_urls": ["URL1", "URL2", "URL3"]
    }},
    "overall_assessment": {{
      "total_score": "CALCULATE: Sum of all 6 main dimension scores (industry_trend + competitive_landscape + policy_regulatory + supply_chain_ecosystem + investment_attractiveness + future_outlook). Range: -60 to 60",
      "recommendation": "Overweight/Equal-weight/Underweight",
      "confidence": "Float from 0.0 to 1.0. Calculate based on: (1) News quantity and quality (0-0.3): >15 high-quality news = 0.3, 8-15 news = 0.2, <8 news = 0.1; (2) Evidence clarity (0-0.3): Clear industry trends with concrete data = 0.3, moderate evidence = 0.2, weak/ambiguous evidence = 0.1; (3) Analysis consistency (0-0.2): Dimension scores align with narrative = 0.2, minor inconsistencies = 0.1, major contradictions = 0.0; (4) Source reliability (0-0.2): Multiple credible sources per dimension = 0.2, some sources missing = 0.1, poor source coverage = 0.0. Example: Good news volume (0.3) + strong evidence (0.3) + consistent analysis (0.2) + good sources (0.2) = 1.0",
      "confidence_justification": "Brief explanation (50-100 words) justifying the confidence score by referencing the four criteria: news quantity, evidence clarity, analysis consistency, and source reliability. Explain which factors contributed most to the final confidence value.",
      "summary": "Overall assessment summary including storyline and future impact",
      "key_insights": ["Insight 1", "Insight 2", "Insight 3"],
      "source_urls": ["Key URL1", "Key URL2", "Key URL3"]
    }}

  **CRITICAL INSTRUCTIONS**:
  1. **ALL OUTPUT MUST BE IN ENGLISH** - Do not use Chinese or any other language
  2. **storyline summary**: Must be concise, 200-400 characters only
  3. **Each dimension analysis**: Must be 100-200 words with detailed explanations and [Source: URL] citations
  4. **Score justification**: Each dimension MUST include a score_justification field (50-100 words) explaining why the specific score was assigned based on the scoring guidelines
  5. **future_outlook is REQUIRED**: Must include score, score_justification, analysis, short/medium/long term impacts, risk_analysis, and stakeholder_impact
  6. **total_score CALCULATION**: total_score MUST equal the sum of all 6 main dimension scores (industry_trend + competitive_landscape + policy_regulatory + supply_chain_ecosystem + investment_attractiveness + future_outlook). Example: if scores are 2, 1, 3, 0, 1, 0, then total_score = 7
  7. Each dimension MUST have at least 2-3 source_urls
  8. Use [Source: URL] format for citations within analysis text
  9. Use ONLY provided news URLs, do NOT fabricate URLs
  10. Analyze based on overall trends, not single news items
  11. Ensure objective, professional, and comprehensive analysis
  12. Provide balanced analysis covering both positive and negative aspects
  13. Include comprehensive risk analysis in future_outlook.risk_analysis field
  14. Scores must align with the scoring guidelines provided above
  15. **confidence CALCULATION**: Follow the explicit formula provided in the confidence field definition above
  16. recommendation should be "Overweight", "Equal-weight", or "Underweight"

# 配置项
config:
  max_recent_headlines: 5  # recent新闻标题数量
  max_representative_news: 15  # representative性新闻最大数量
  headline_max_length: 100  # 标题最大长度
  summary_max_length: 200  # 摘要最大长度
  representative_per_type: 2  # 每种事件类型选取的新闻数
